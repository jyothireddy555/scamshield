name: scamshield
description: "ScamShield — AI-powered scam detection for messages and calls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Screenshot + OCR
  screenshot: ^3.0.0
  google_mlkit_text_recognition: ^0.11.0

  # Networking
  http: ^1.1.0

  # Storage
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Image
  url_launcher: ^6.2.2
  image_cropper: ^11.0.0
  image_picker: ^1.1.2

  # Contacts (to skip known callers)
  flutter_contacts: ^1.1.7

  # Permissions
  permission_handler: ^11.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true